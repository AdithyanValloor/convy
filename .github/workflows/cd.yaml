name: CD

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: melo.adithyanvalloor.com
      DEPLOY_USER: vallooradithyan

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY_B64: ${{ secrets.MELO_SSH_PRIVATE_KEY_B64 }}
          SSH_KNOWN_HOSTS: ${{ secrets.MELO_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s' "$SSH_PRIVATE_KEY_B64" \
            | base64 --decode \
            > ~/.ssh/melo_github_actions

          chmod 600 ~/.ssh/melo_github_actions

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Validate SSH key
        run: |
          ssh-keygen -y \
            -f ~/.ssh/melo_github_actions \
            > /tmp/derived_public_key

          echo "SSH private key parsed successfully"

      - name: Update production source 
        run: |
            ssh \
              -i ~/.ssh/melo_github_actions \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              '
                set -e

                cd ~/melo

                echo "Current commit:"
                git rev-parse --short HEAD

                echo "Fetching latest main..."
                git fetch origin main

                echo "Updating production checkout..."
                git reset --hard origin/main

                echo "New commit:"
                git rev-parse --short HEAD
              '

      - name: Deploy services
        run: |
            ssh \
              -i ~/.ssh/melo_github_actions \
              -o IdentitiesOnly=yes \
              -o StrictHostKeyChecking=yes \
              "$DEPLOY_USER@$DEPLOY_HOST" \
              '
                set -e

                cd ~/melo

                docker compose up -d --build \
                  auth-service \
                  message-service

                docker compose ps
              '