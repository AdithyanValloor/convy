name: CD

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: melo.adithyanvalloor.com
      DEPLOY_USER: vallooradithyan

    steps:
      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.MELO_SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.MELO_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/melo_github_actions
          chmod 600 ~/.ssh/melo_github_actions

          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh \
            -i ~/.ssh/melo_github_actions \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            'whoami && hostname && echo "SSH connection successful"'