server {
    listen 80;
    server_name melo.adithyanvalloor.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name melo.adithyanvalloor.com;

    ssl_certificate /etc/letsencrypt/live/melo.adithyanvalloor.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/melo.adithyanvalloor.com/privkey.pem;

    include /etc/nginx/snippets/proxy-routes.conf;
}
