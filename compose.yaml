services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management
    container_name: rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
    image: melo-backend:v1
    container_name: melo-backend
    restart: unless-stopped
    env_file:
      - ./apps/backend/.env
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: ./apps/auth-service/Dockerfile
    image: melo-auth-service:v1
    container_name: melo-auth
    restart: unless-stopped
    env_file:
      - ./apps/auth-service/.env
    depends_on:
      redis:
        condition: service_started

  message-service:
    build:
      context: .
      dockerfile: ./apps/message-service/Dockerfile
    image: melo-message-service:v1
    container_name: melo-message-service
    restart: unless-stopped

    env_file:
      - ./apps/message-service/.env
    depends_on:
      redis:
        condition: service_started
      rabbitmq:
        condition: service_healthy

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API: /api

    image: melo-frontend:v1
    container_name: melo-frontend

    restart: unless-stopped

  nginx:
    image: nginx:alpine
    container_name: nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
