services:
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: ./apps/backend/Dockerfile
    image: whisp-backend:v1
    container_name: whisp-backend
    restart: unless-stopped

    ports:
      - "9000:9000"
    env_file:
      - ./apps/backend/.env
    depends_on:
      - redis

  auth-service:
    build:
      context: .
      dockerfile: ./apps/auth-service/Dockerfile
    image: whisp-auth-service:v1
    container_name: whisp-auth
    restart: unless-stopped

    ports:
      - "9001:9001"
    env_file:
      - ./apps/auth-service/.env
    depends_on:
      - redis

  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API: http://localhost/api
        NEXT_PUBLIC_SOCKET_URL: http://localhost
        
    image: whisp-frontend:v1
    container_name: whisp-frontend
    ports:
      - "3000:3000"
    restart: unless-stopped


  nginx: 
    image: nginx:alpine
    container_name: nginx
    ports: 
      - "80:80"
    volumes: 
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped
  
  